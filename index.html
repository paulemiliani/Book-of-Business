<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book of Business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Videa brand */
    --periwinkle:#9ABEF4;
    --deep-teal:#123C4B;
    --ice:#EEF4FF;
    --gold:#DFDA02;
    --lime:#EAF457;

    --bg:#EEF4FF;
    --surface:#FFFFFF;
    --surface-sunken:#E4EDFC;
    --ink:#123C4B;
    --ink-soft:#4F6D78;
    --ink-faint:#8CA2AA;
    --accent:#123C4B;
    --accent-ink:#0B2833;
    --accent-soft:#E4EDFC;
    --line:#D7E2EC;
    --line-strong:#B8CCDA;
    --good:#1E9E6B;
    --good-bg:#E6F6EF;
    --mod:#B8790E;
    --mod-bg:#FBF1DC;
    --risk:#D6483C;
    --risk-bg:#FBEAE8;
    --dropped:#7E92A0;
    --dropped-bg:#E7ECF1;
    --radius:10px;
    --shadow:0 1px 2px rgba(18,60,75,0.05), 0 8px 24px rgba(18,60,75,0.08);
    --font-display:'Literata',serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:var(--accent);}

  /* ---------- App shell ---------- */
  .app-header{
    position:sticky;top:0;z-index:20;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:14px 28px;
    display:flex;align-items:center;gap:16px;
  }
  .brand{
    display:flex;align-items:center;gap:12px;
    white-space:nowrap;
  }
  .brand img{height:22px;display:block;}
  .brand .divider{width:1px;height:20px;background:var(--line-strong);}
  .brand .app-label{
    font-family:var(--font-body);
    font-weight:600;
    font-size:14px;
    letter-spacing:.01em;
    color:var(--ink-soft);
  }
  .header-spacer{flex:1;}
  .header-actions{display:flex;gap:8px;align-items:center;}

  .btn{
    border:1px solid var(--line-strong);
    background:var(--surface);
    color:var(--ink);
    padding:8px 14px;
    border-radius:8px;
    font-size:13px;
    font-weight:600;
    display:inline-flex;align-items:center;gap:6px;
    transition:background .12s ease, border-color .12s ease;
  }
  .btn:hover{background:var(--surface-sunken);}
  .btn-primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .btn-primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);}
  .btn-ghost{
    border-color:transparent;
    background:transparent;
    color:var(--ink-soft);
  }
  .btn-ghost:hover{background:var(--surface-sunken);color:var(--ink);}
  .btn-danger{color:var(--risk);border-color:var(--risk-bg);background:var(--risk-bg);}
  .btn-danger:hover{background:#f7d9d6;}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:6px;}

  .main{max-width:1180px;margin:0 auto;padding:28px;}

  /* ---------- Overview ---------- */
  .overview-toolbar{
    display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;
  }
  .search-box{
    flex:1;min-width:220px;
    display:flex;align-items:center;gap:8px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 12px;
  }
  .search-box input{
    border:none;outline:none;background:transparent;
    font-size:13px;width:100%;color:var(--ink);
  }
  .search-box svg{flex-shrink:0;color:var(--ink-faint);}
  .filter-chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{
    border:1px solid var(--line);
    background:var(--surface);
    padding:6px 12px;
    border-radius:20px;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
  }
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .summary-strip{
    display:grid;grid-template-columns:repeat(5,1fr);
    gap:10px;margin-bottom:22px;
  }
  .summary-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .summary-card .num{
    font-family:var(--font-mono);
    font-size:22px;font-weight:600;
    display:block;
  }
  .summary-card .label{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .summary-card.good .num{color:var(--good);}
  .summary-card.mod .num{color:var(--mod);}
  .summary-card.risk .num{color:var(--risk);}

  .account-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:14px;
  }

  .overview-layout{
    display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start;
  }
  @media (max-width:900px){.overview-layout{grid-template-columns:1fr;}}
  .overview-sidebar .sticky{position:sticky;top:80px;}
  .oi-group{margin-bottom:16px;}
  .oi-group:last-child{margin-bottom:0;}
  .oi-group-title{
    font-size:12px;font-weight:700;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;
    cursor:pointer;transition:color .12s ease;
  }
  .oi-group-title:hover{color:var(--accent);}
  .oi-item{
    display:flex;align-items:flex-start;gap:8px;
    padding:5px 0;font-size:13px;cursor:pointer;
  }
  .oi-item input{margin-top:2px;width:15px;height:15px;accent-color:var(--good);flex-shrink:0;}
  .account-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    position:relative;
    display:flex;flex-direction:column;gap:10px;
  }
  .account-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line-strong);}
  .account-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .account-name{font-family:var(--font-display);font-weight:600;font-size:16px;line-height:1.25;}
  .health-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px;}
  .health-dot.good{background:var(--good);}
  .health-dot.mod{background:var(--mod);}
  .health-dot.risk{background:var(--risk);}
  .health-dot.dropped{background:var(--dropped);}

  .badge{
    display:inline-flex;align-items:center;
    font-size:11px;font-weight:700;
    padding:3px 8px;border-radius:5px;
    letter-spacing:.02em;text-transform:uppercase;
    width:fit-content;
  }
  .badge-pilot{background:var(--ice);color:var(--accent-ink);border:1px solid var(--line-strong);}
  .badge-rollout{background:#DCE8FB;color:var(--accent-ink);}
  .badge-expansion{background:var(--periwinkle);color:var(--accent-ink);}
  .badge-commercial{background:var(--deep-teal);color:#fff;}
  .badge-dropped{background:var(--dropped-bg);color:var(--dropped);}

  .card-meta{font-size:12.5px;color:var(--ink-soft);display:flex;flex-direction:column;gap:3px;}
  .meta-row{padding:1px 0;}
  .meta-row-warn{
    background:#FFF3C4;color:#7A5D00;
    padding:3px 6px;margin:1px -6px;border-radius:5px;
  }
  .meta-row-warn b{color:#7A5D00;}
  .card-meta span b{color:var(--ink);font-weight:600;font-family:var(--font-mono);}
  .card-footer{
    display:flex;justify-content:space-between;align-items:center;
    border-top:1px solid var(--line);padding-top:10px;margin-top:2px;
    font-size:11.5px;color:var(--ink-faint);
  }

  .empty-state{
    text-align:center;padding:80px 20px;color:var(--ink-soft);
  }
  .empty-state h2{font-family:var(--font-display);color:var(--ink);margin-bottom:6px;}
  .empty-state p{margin-bottom:20px;font-size:14px;}

  /* ---------- Detail view ---------- */
  .detail-header{
    display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;
  }
  .detail-title{display:flex;flex-direction:column;gap:6px;}
  .detail-title input{
    font-family:var(--font-display);font-weight:700;font-size:26px;
    border:none;background:transparent;outline:none;color:var(--ink);
    padding:2px 0;border-bottom:2px solid transparent;
    max-width:520px;
  }
  .detail-title input:focus{border-bottom-color:var(--accent);}
  .detail-sub{display:flex;gap:8px;align-items:center;color:var(--ink-soft);font-size:12.5px;}

  .detail-grid{
    display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start;
  }
  @media (max-width:820px){.detail-grid{grid-template-columns:1fr;}}

  .panel{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;
  }
  .panel-title{
    font-family:var(--font-display);font-weight:600;font-size:14px;
    margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;
  }
  .sticky{position:sticky;top:80px;}

  .field-row{margin-bottom:14px;}
  .field-row:last-child{margin-bottom:0;}
  .field-label{
    display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;
  }
  .pill-group{display:flex;flex-wrap:wrap;gap:6px;}
  .pill{
    border:1px solid var(--line);background:var(--surface-sunken);
    color:var(--ink-soft);font-size:12.5px;font-weight:600;
    padding:6px 12px;border-radius:20px;transition:all .12s ease;
  }
  .pill.selected{background:var(--ink);color:#fff;border-color:var(--ink);}
  .pill.health-good.selected{background:var(--good);border-color:var(--good);}
  .pill.health-mod.selected{background:var(--mod);border-color:var(--mod);}
  .pill.health-risk.selected{background:var(--risk);border-color:var(--risk);}
  .pill.phase-dropped.selected{background:var(--dropped);border-color:var(--dropped);}

  .text-input, select.text-input{
    width:100%;border:1px solid var(--line);border-radius:7px;
    padding:8px 10px;font-size:13px;color:var(--ink);background:var(--surface);
    outline:none;
  }
  .text-input:focus{border-color:var(--accent);}
  textarea.text-input{resize:vertical;min-height:80px;line-height:1.5;}

  /* Rich text editor (Current update) */
  .rte-toolbar{
    display:flex;flex-wrap:wrap;align-items:center;gap:3px;
    padding:6px;background:var(--surface-sunken);
    border:1px solid var(--line);border-bottom:none;
    border-radius:8px 8px 0 0;
  }
  .rte-btn{
    min-width:30px;height:30px;padding:0 8px;
    border:1px solid transparent;border-radius:6px;
    background:transparent;color:var(--ink-soft);
    font-size:13px;font-family:var(--font-body);
    display:flex;align-items:center;justify-content:center;
    line-height:1;
  }
  .rte-btn:hover{background:var(--surface);border-color:var(--line-strong);}
  .rte-btn.active{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--periwinkle);}
  .rte-sep{width:1px;height:20px;background:var(--line-strong);margin:0 3px;}
  .rte-editor{
    border-radius:0 0 7px 7px;
    min-height:130px;line-height:1.6;
  }
  .rte-editor:focus{border-color:var(--accent);}
  .rte-editor:empty:before{content:attr(data-placeholder);color:var(--ink-faint);}
  .rte-editor p{margin:0 0 8px;}
  .rte-editor p:last-child{margin-bottom:0;}
  .rte-editor ul,.rte-editor ol{margin:0 0 8px;padding-left:22px;}
  .rte-editor blockquote{
    margin:0 0 8px;padding:2px 0 2px 14px;
    border-left:3px solid var(--periwinkle);color:var(--ink-soft);
  }
  .rte-editor a{color:var(--accent);text-decoration:underline;}
  .rte-editor mark{background:#FDF2A4;color:inherit;border-radius:2px;}

  .stat-line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;}
  .stat-line:last-child{border-bottom:none;}
  .stat-line .v{font-family:var(--font-mono);font-weight:600;}

  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  @media (max-width:520px){.two-col,.three-col{grid-template-columns:1fr;}}

  .pms-row,.imaging-row{display:grid;grid-template-columns:1fr 100px 32px;gap:8px;margin-bottom:8px;align-items:center;}
  .link-row{display:grid;grid-template-columns:1fr 1fr 32px 32px;gap:8px;margin-bottom:8px;align-items:center;}
  .link-open{color:var(--ink-faint);text-decoration:none;}
  .link-open:hover{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-soft);}
  .team-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .team-row:last-child{margin-bottom:0;}
  .team-row .role{
    width:34px;flex-shrink:0;text-align:center;
    font-family:var(--font-mono);font-weight:700;font-size:11.5px;
    color:var(--accent-ink);background:var(--accent-soft);
    border-radius:6px;padding:6px 0;
  }
  .team-row input{flex:1;}

  .section-edit-btn{
    width:26px;height:26px;flex-shrink:0;
    border:1px solid var(--line);border-radius:6px;
    background:var(--surface);color:var(--ink-faint);
    display:flex;align-items:center;justify-content:center;
  }
  .section-edit-btn:hover{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--periwinkle);}
  .section-edit-btn.is-done{background:var(--good-bg);color:var(--good);border-color:var(--good-bg);}
  .group-name-row{display:grid;grid-template-columns:1fr 32px;gap:8px;margin-bottom:8px;align-items:center;}
  .stat-line.wrap{align-items:flex-start;}
  .stat-line.wrap .v{text-align:right;font-family:var(--font-body);font-weight:500;max-width:65%;}
  .link-row-display{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:7px 0;border-bottom:1px solid var(--line);
  }
  .link-row-display:last-child{border-bottom:none;}
  .link-row-display a{color:var(--accent);font-weight:600;font-size:13px;text-decoration:none;}
  .link-row-display a:hover{text-decoration:underline;}
  .link-row-actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn-sm{width:26px;height:26px;}
  .product-card{border:1px solid var(--line);border-radius:8px;padding:14px 16px;}
  .product-card .panel-title{margin-bottom:12px;}
  .phase-box-row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;}
  .phase-box{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--surface);}
  .phase-box.is-full{flex:1 1 100%;}
  .phase-box.is-compact{flex:1 1 calc(33.333% - 10px);min-width:190px;}
  .stat-line.stacked{flex-direction:column;align-items:flex-start;gap:2px;}
  .stat-line.stacked .v{font-size:11px;color:var(--ink-faint);font-weight:500;}
  .icon-btn{
    width:32px;height:32px;border-radius:7px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink-faint);display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:hover{background:var(--risk-bg);color:var(--risk);border-color:var(--risk-bg);}

  .product-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .product-check{
    display:flex;align-items:center;gap:9px;padding:9px 10px;
    border:1px solid var(--line);border-radius:7px;font-size:13px;font-weight:500;
    background:var(--surface-sunken);color:var(--ink-soft);cursor:pointer;transition:all .12s ease;
  }
  .product-check.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}
  .product-check input{accent-color:var(--accent);width:15px;height:15px;}

  .action-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
  .action-item:last-child{border-bottom:none;}
  .action-item input[type=checkbox]{width:17px;height:17px;accent-color:var(--good);flex-shrink:0;}
  .action-item .txt{flex:1;font-size:13.5px;}
  .action-item.done .txt{text-decoration:line-through;color:var(--ink-faint);}
  .action-add{display:flex;gap:8px;margin-top:10px;}

  .pilot-term-badge{
    font-family:var(--font-mono);font-weight:600;font-size:13px;
    background:var(--accent-soft);color:var(--accent-ink);
    padding:4px 10px;border-radius:6px;display:inline-block;
  }

  .cadence-row{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;}

  /* modal */
  .overlay{
    position:fixed;inset:0;background:rgba(18,22,31,0.4);
    display:flex;align-items:center;justify-content:center;z-index:50;
  }
  .modal{
    background:var(--surface);border-radius:12px;padding:24px;
    width:380px;box-shadow:0 20px 60px rgba(0,0,0,0.25);
  }
  .modal h3{font-family:var(--font-display);margin:0 0 16px;}
  .modal .field-row{margin-bottom:16px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}

  .hidden{display:none !important;}
  input[type=file]{display:none;}
</style>
</head>

<script>
/* ---------------------------------------------------------
   Data model + persistence
--------------------------------------------------------- */
const STORAGE_KEY = 'book-of-business-state';
const PRODUCTS = ['Clinical Assist','Daily Dashboard','Insights','Voice Notes','Voice Perio','Ambient Intelligence','Clean Claims','Auto Verify','Recall'];
const SEGMENTS = [
  {key:'Enterprise', label:'Enterprise', range:'76+'},
  {key:'Upper MM', label:'Upper MM', range:'32–75'},
  {key:'Lower MM', label:'Lower MM', range:'7–31'},
  {key:'SMB', label:'SMB', range:'1–6'}
];
const DAYS = ['Mon','Tue','Wed','Thu','Fri'];

// GITHUB / SELF-HOSTED VERSION — uses the browser's own localStorage instead of
// Claude's window.storage, since window.storage only exists inside Claude's artifact
// environment. Data here lives in THIS browser, on THIS device, for THIS domain.
async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return { accounts: [] };
    const parsed = JSON.parse(raw);
    if(Array.isArray(parsed.accounts)) parsed.accounts.forEach(normalizeAccount);
    return parsed;
  }catch(e){
    console.warn('Could not read saved data', e);
    return { accounts: [] };
  }
}
let saveInFlight = null;
let dataReady = false; // only true once we've completed a trustworthy load — gates all saves
async function saveState(){
  if(!dataReady){
    setSaveStatus('error');
    return;
  }
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    setSaveStatus('saved');
  }catch(e){
    // Most commonly: private/incognito mode, or the browser's storage quota was hit.
    console.warn('Could not save data', e);
    setSaveStatus('error');
  }
}
function setSaveStatus(status){
  const el = document.getElementById('save-status');
  if(!el) return;
  if(status === 'saving'){ el.textContent = 'Saving…'; el.style.color = 'var(--ink-faint)'; }
  else if(status === 'saved'){ el.textContent = 'Saved'; el.style.color = 'var(--good)'; }
  else { el.textContent = 'Could not save — check browser storage'; el.style.color = 'var(--risk)'; }
}
function persist(){
  setSaveStatus('saving');
  saveInFlight = saveState();
}

let state = { accounts: [] };
let currentAccountId = null;
let searchQuery = '';
let activeFilter = 'All';

function uid(){ return 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function newAccount(name){
  return {
    id: uid(),
    name: name || 'New Account',
    health: 'good',
    experience: 'Standalone',
    pms: [{name:'', practices:0}],
    imaging: [{name:'', practices:0}],
    livePractices: 0,
    contractedPractices: 0,
    productGroups: [], // [{id, products:[names], phase, live, contracted, startDate, endDate, groupNames}]
    segment: 'SMB',
    cadence: {day:'Mon', time:'', frequency:'Bi-weekly'},
    currentUpdate: '',
    actionItems: [],
    links: [],
    team: {CSM:'', AM:'', IE:'', OS:'', AE:''},
    createdAt: Date.now()
  };
}

function defaultGroupFields(){
  return {live:0, contracted:0, startDate:'', endDate:'', groupNames:[], dateDropped:'', reason:''};
}

// Fills in fields that may be missing on accounts saved by an earlier version of the app.
function normalizeAccount(acc){
  if(!Array.isArray(acc.pms)) acc.pms = [{name:'', practices:0}];
  if(!Array.isArray(acc.imaging)) acc.imaging = [{name:'', practices:0}];
  if(!Array.isArray(acc.actionItems)) acc.actionItems = [];
  if(!Array.isArray(acc.links)) acc.links = [];
  acc.links.forEach(l => { if(typeof l.id !== 'string') l.id = uid(); });
  if(!acc.team || typeof acc.team !== 'object') acc.team = {CSM:'', AM:'', IE:'', OS:'', AE:''};
  ['CSM','AM','IE','OS','AE'].forEach(role => { if(typeof acc.team[role] !== 'string') acc.team[role] = ''; });
  if(!acc.cadence) acc.cadence = {day:'Mon', time:'', frequency:'Bi-weekly'};

  // Migrate the previous per-product / fixed-phase-box structure into user-defined groups,
  // consolidating numbers rather than discarding them.
  if(!Array.isArray(acc.productGroups)){
    acc.productGroups = [];
    if(acc.productDetails && typeof acc.productDetails === 'object' && Array.isArray(acc.productMix)){
      const byPhase = {};
      acc.productMix.forEach(p => {
        const d = acc.productDetails[p];
        if(!d) return;
        const ph = (d.phase === 'Pilot' || d.phase === 'Rollout' || d.phase === 'Commercial') ? d.phase : 'Pilot';
        if(!byPhase[ph]) byPhase[ph] = {products:[], live:0, contracted:0};
        byPhase[ph].products.push(p);
        byPhase[ph].live += Number(d.live)||0;
        byPhase[ph].contracted += Number(d.contracted)||0;
      });
      Object.keys(byPhase).forEach(ph => {
        const g = byPhase[ph];
        acc.productGroups.push({
          id: uid(),
          products: g.products,
          phase: ph,
          live: g.live,
          contracted: g.contracted,
          startDate: (ph === 'Pilot' && acc.pilotGroup) ? (acc.pilotGroup.startDate||'') : '',
          endDate: (ph === 'Pilot' && acc.pilotGroup) ? (acc.pilotGroup.endDate||'') : '',
          groupNames: (ph === 'Pilot' && acc.pilotGroup && Array.isArray(acc.pilotGroup.groupNames)) ? acc.pilotGroup.groupNames : []
        });
      });
    }
    delete acc.productMix;
    delete acc.productDetails;
    delete acc.pilotGroup;
    delete acc.pilot;
    delete acc.phase;
  }
  acc.productGroups.forEach(g => {
    if(typeof g.id !== 'string') g.id = uid();
    if(!Array.isArray(g.products)) g.products = [];
    if(g.phase !== 'Pilot' && g.phase !== 'Rollout' && g.phase !== 'Commercial' && g.phase !== 'Dropped') g.phase = 'Pilot';
    if(typeof g.live !== 'number') g.live = Number(g.live)||0;
    if(typeof g.contracted !== 'number') g.contracted = Number(g.contracted)||0;
    if(typeof g.startDate !== 'string') g.startDate = '';
    if(typeof g.endDate !== 'string') g.endDate = '';
    if(!Array.isArray(g.groupNames)) g.groupNames = [];
    if(typeof g.dateDropped !== 'string') g.dateDropped = '';
    if(typeof g.reason !== 'string') g.reason = '';
  });
  // A product should only ever belong to one group — if data got duplicated somehow, keep
  // its first occurrence only, so nothing renders in two places at once.
  const seen = new Set();
  acc.productGroups.forEach(g => {
    g.products = g.products.filter(p => {
      if(seen.has(p)) return false;
      seen.add(p);
      return true;
    });
  });
  acc.productGroups = acc.productGroups.filter(g => g.products.length > 0);

  if(typeof acc.currentUpdate !== 'string') acc.currentUpdate = '';
  return acc;
}

/* ---------------------------------------------------------
   Helpers
--------------------------------------------------------- */
// Tracks which display/edit-toggle sections are forced into edit mode this session.
// Not persisted — resets naturally on reload. Key: `${accountId}:${sectionKey}`.
let editState = {};
// Whether the "add products" checklist is currently open, per account (session-only, resets on reload).
let addProductsOpen = {};
function assignedProducts(a){
  return a.productGroups.flatMap(g => g.products);
}
function remainingProducts(a){
  const assigned = assignedProducts(a);
  return PRODUCTS.filter(p => !assigned.includes(p));
}
function groupHasData(g){
  if(g.phase === 'Pilot'){
    return !!(g.startDate || g.endDate || (g.live||0) > 0 || (g.contracted||0) > 0 || (g.groupNames||[]).some(n=>n.trim()));
  }
  if(g.phase === 'Dropped'){
    return !!(g.dateDropped || g.reason.trim());
  }
  return (g.live||0) > 0 || (g.contracted||0) > 0;
}
function sectionHasData(a, key){
  if(key.indexOf('group:') === 0){
    const g = a.productGroups.find(gr => gr.id === key.slice(6));
    return g ? groupHasData(g) : false;
  }
  switch(key){
    case 'cadence': return !!a.cadence.time;
    case 'accountDetails': return a.pms.some(p=>p.name.trim()) && a.imaging.some(p=>p.name.trim());
    default: return false;
  }
}
// Customer Phase is no longer set manually — it's computed from each product's group's phase.
function computeCustomerPhase(a){
  const assigned = assignedProducts(a);
  if(assigned.length === 0) return 'Pilot';
  const phaseByProduct = {};
  a.productGroups.forEach(g => g.products.forEach(p => { phaseByProduct[p] = g.phase; }));
  const allPhases = assigned.map(p => phaseByProduct[p] || 'Pilot');
  if(allPhases.every(ph => ph === 'Dropped')) return 'Dropped';
  const phases = allPhases.filter(ph => ph !== 'Dropped');
  if(phases.length === 0) return 'Dropped';
  const allPilot = phases.every(ph => ph === 'Pilot');
  const allCommercial = phases.every(ph => ph === 'Commercial');
  const hasCommercial = phases.some(ph => ph === 'Commercial');
  const hasPilot = phases.some(ph => ph === 'Pilot');
  const hasRollout = phases.some(ph => ph === 'Rollout');
  if(allPilot) return 'Pilot';
  if(allCommercial) return 'Commercial';
  if(hasCommercial && hasPilot) return 'Expansion Pilot';
  if(hasRollout) return 'Rollout';
  return 'Pilot';
}
function isSectionEditing(accountId, key, hasData){
  const stateKey = `${accountId}:${key}`;
  // Establish the initial mode once (edit if empty, display if already filled), then stick
  // with it across re-renders. Without this, any section with a completion event that fires
  // mid-edit (e.g. a checkbox's change event, which fires per-click with no "blur" pause)
  // would flip back to display the instant the first item was selected/typed.
  if(!(stateKey in editState)) editState[stateKey] = !hasData;
  return editState[stateKey];
}
function toggleSectionEdit(accountId, key, hasData){
  const stateKey = `${accountId}:${key}`;
  editState[stateKey] = !isSectionEditing(accountId, key, hasData);
}
function clearSectionOverride(accountId, key){
  delete editState[`${accountId}:${key}`];
}
function formatTime12h(t){
  if(!t) return '';
  const [h,m] = t.split(':').map(Number);
  const period = h >= 12 ? 'PM' : 'AM';
  const h12 = ((h + 11) % 12) + 1;
  return `${h12}:${String(m).padStart(2,'0')} ${period}`;
}
function formatCadence(c){
  const parts = [c.frequency, c.day, c.time ? formatTime12h(c.time) : null].filter(Boolean);
  return parts.length ? parts.join(' · ') : '—';
}

function daysBetween(a,b){
  if(!a || !b) return null;
  const d1 = new Date(a), d2 = new Date(b);
  return Math.round((d2 - d1) / 86400000);
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d);
  return dt.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}
function badgeClass(phase){
  return {
    'Pilot':'badge-pilot','Rollout':'badge-rollout','Expansion Pilot':'badge-expansion',
    'Commercial':'badge-commercial','Dropped':'badge-dropped'
  }[phase] || 'badge-pilot';
}
function healthLabel(h){ return {good:'Healthy', mod:'Moderate', risk:'At Risk'}[h] || 'Healthy'; }

function icon(name){
  const icons = {
    search:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',

/* ---------------------------------------------------------
   Render: header actions
--------------------------------------------------------- */
function renderHeaderActions(){
  document.getElementById('header-actions').innerHTML = `
    <span id="save-status" style="font-size:12px;color:var(--ink-faint);margin-right:4px;">Saved</span>
    <button class="btn btn-ghost btn-sm" id="btn-export" title="Tip: export a backup before asking Claude for new changes, and again after to confirm nothing was lost.">${icon('download')} Export</button>
    <button class="btn btn-ghost btn-sm" id="btn-import">${icon('upload')} Import</button>
    <input type="file" id="file-import" accept="application/json">
    <button class="btn btn-primary" id="btn-new-account">${icon('plus')} New account</button>
  `;
  document.getElementById('btn-new-account').onclick = openNewAccountModal;
  document.getElementById('btn-export').onclick = exportData;
  document.getElementById('btn-import').onclick = () => document.getElementById('file-import').click();
  document.getElementById('file-import').onchange = importData;
}

function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `book-of-business-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(parsed && Array.isArray(parsed.accounts)){
        parsed.accounts.forEach(normalizeAccount);
        state = parsed;
        dataReady = true; // explicit, user-initiated overwrite — different from an automatic silent one
        persist();
        render();
      } else {
        showNoticeModal('Import Failed', 'This file does not look like a Book of Business export.');
      }
    }catch(err){ showNoticeModal('Import Failed', 'Could not read that file.'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

  const counts = {good:0, mod:0, risk:0};
  accounts.forEach(a => { if(counts[a.health] !== undefined) counts[a.health]++; });
  const totalPilots = accounts.filter(a => {
    const cp = computeCustomerPhase(a);
    return cp === 'Pilot' || cp === 'Expansion Pilot';
  }).length;

  const filters = ['All', 'Pilot', 'Rollout', 'Commercial', 'Dropped'];
  let filtered = accounts.filter(a => {
    if(activeFilter === 'All') return true;
    const cp = computeCustomerPhase(a);
    if(activeFilter === 'Pilot') return cp === 'Pilot' || cp === 'Expansion Pilot';
    return cp === activeFilter;
  });
  if(searchQuery.trim()){
    const q = searchQuery.trim().toLowerCase();
    filtered = filtered.filter(a => a.name.toLowerCase().includes(q));
  }

    <div class="overview-layout">

            <input type="text" id="search-input" placeholder="Search accounts…" value="${escapeHtml(searchQuery)}">

          <div class="filter-chips">

        </div>

        <div class="account-grid">
          ${filtered.map(renderAccountCard).join('')}
        </div>`}
      </div>

      <div class="overview-sidebar">
        <div class="panel sticky">
          <div class="panel-title">Open Action Items</div>
          ${renderOpenActionItems(accounts)}
        </div>
      </div>
    </div>
  `;

  document.getElementById('search-input').oninput = (e) => { searchQuery = e.target.value; renderOverview(); };
  document.querySelectorAll('.chip').forEach(chip => {
    chip.onclick = () => { activeFilter = chip.dataset.filter; renderOverview(); };
  });
  document.querySelectorAll('.account-card').forEach(card => {
    card.onclick = () => openDetail(card.dataset.id);
  });
  document.querySelectorAll('.oi-group-title').forEach(el => {
    el.onclick = () => openDetail(el.dataset.id);
  });
  document.querySelectorAll('.oi-item input').forEach(cb => {
    cb.onclick = (e) => e.stopPropagation();
    cb.onchange = () => {
      const row = cb.closest('.oi-item');
      const acc = state.accounts.find(x => x.id === row.dataset.account);
      if(acc){
        const item = acc.actionItems.find(i => i.id === row.dataset.item);
        if(item) item.done = true;
        persist();
        renderOverview();
      }
    };
  });
}

function renderOpenActionItems(accounts){
  const groups = accounts
    .map(a => ({ a, items: (a.actionItems||[]).filter(i => !i.done) }))
    .filter(g => g.items.length > 0);

  if(groups.length === 0){
    return `<p style="color:var(--ink-faint);font-size:13px;margin:4px 0;">You're all caught up — no open action items.</p>`;
  }

  return groups.map(g => `
    <div class="oi-group">
      <div class="oi-group-title" data-id="${g.a.id}">${escapeHtml(g.a.name)}</div>
      ${g.items.map(item => `
        <label class="oi-item" data-account="${g.a.id}" data-item="${item.id}">
          <input type="checkbox">
          <span>${escapeHtml(item.text)}</span>
        </label>
      `).join('')}
    </div>
  `).join('');
}

function renderAccountCard(a){
  const computedPhase = computeCustomerPhase(a);
  const assigned = assignedProducts(a);
  return `
    <div class="account-card" data-id="${a.id}">
      <div class="account-card-top">
        <div>
          <span class="badge ${badgeClass(computedPhase)}">${computedPhase}</span>
          <div class="account-name" style="margin-top:6px;">${escapeHtml(a.name)}</div>
        </div>
        <div class="health-dot ${a.health}" title="${healthLabel(a.health)}"></div>
      </div>
      <div class="card-meta">
        <span>Segment: <b>${a.segment}</b></span>
        <span>Products Active: <b>${assigned.length}</b></span>
        ${a.productGroups.length === 0 ? `<span style="color:var(--ink-faint);">No products selected</span>` : a.productGroups.map(g => {
          if(g.phase === 'Dropped'){
            return `<span class="meta-row">${g.products.map(escapeHtml).join(' + ')} (Dropped)</span>`;
          }
          // Pilots are naturally live < contracted early on — only Commercial products
          // being behind is actually worth flagging.
          const underDelivering = g.phase === 'Commercial' && (g.live||0) < (g.contracted||0);
          return `<span class="meta-row ${underDelivering ? 'meta-row-warn' : ''}" title="${underDelivering ? 'Behind its contracted count' : ''}">${g.products.map(escapeHtml).join(' + ')} (${g.phase}): <b>${g.live||0} / ${g.contracted||0}</b></span>`;
        }).join('')}
      </div>
      <div class="card-footer">
        <span>${assigned.length} product${assigned.length===1?'':'s'} active</span>
        <span>${healthLabel(a.health)}</span>
      </div>
    </div>
  `;
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------------------------------------------------------
   New account modal
--------------------------------------------------------- */
// Native confirm()/alert()/prompt() are unreliable inside Claude's sandboxed artifact
// preview — they can silently fail to appear, leaving code waiting on a response that
// never comes. These render an actual in-page modal instead, using the same overlay
// pattern as the New Account modal.
function showConfirmModal(title, message, confirmLabel, onConfirm){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="overlay" id="modal-overlay">
      <div class="modal">
        <h3>${escapeHtml(title)}</h3>
        <p style="font-size:13.5px;color:var(--ink-soft);margin:0 0 20px;line-height:1.5;">${escapeHtml(message)}</p>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
          <button class="btn btn-danger" id="modal-confirm">${escapeHtml(confirmLabel)}</button>
        </div>
      </div>
    </div>
  `;
  const close = () => root.innerHTML = '';
  document.getElementById('modal-overlay').onclick = (e) => { if(e.target.id==='modal-overlay') close(); };
  document.getElementById('modal-cancel').onclick = close;
  document.getElementById('modal-confirm').onclick = () => { close(); onConfirm(); };
}

function showNoticeModal(title, message){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="overlay" id="modal-overlay">
      <div class="modal">
        <h3>${escapeHtml(title)}</h3>
        <p style="font-size:13.5px;color:var(--ink-soft);margin:0 0 20px;line-height:1.5;">${escapeHtml(message)}</p>
        <div class="modal-actions">
          <button class="btn btn-primary" id="modal-ok">OK</button>
        </div>
      </div>
    </div>
  `;
  const close = () => root.innerHTML = '';
  document.getElementById('modal-overlay').onclick = (e) => { if(e.target.id==='modal-overlay') close(); };
  document.getElementById('modal-ok').onclick = close;
}

function showPromptModal(title, placeholder, submitLabel, onSubmit){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="overlay" id="modal-overlay">
      <div class="modal">
        <h3>${escapeHtml(title)}</h3>
        <div class="field-row">
          <input type="text" id="modal-prompt-input" class="text-input" placeholder="${escapeHtml(placeholder)}" autofocus>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
          <button class="btn btn-primary" id="modal-submit">${escapeHtml(submitLabel)}</button>
        </div>
      </div>
    </div>
  `;
  const input = document.getElementById('modal-prompt-input');
  const close = () => root.innerHTML = '';
  document.getElementById('modal-overlay').onclick = (e) => { if(e.target.id==='modal-overlay') close(); };
  document.getElementById('modal-cancel').onclick = close;
  document.getElementById('modal-submit').onclick = () => {
    const val = input.value.trim();
    close();
    if(val) onSubmit(val);
  };
  input.onkeydown = (e) => { if(e.key === 'Enter') document.getElementById('modal-submit').click(); };
  setTimeout(()=>input.focus(), 30);
}

function openNewAccountModal(){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="overlay" id="modal-overlay">
      <div class="modal">
        <h3>New Account</h3>
        <div class="field-row">
          <label class="field-label">Account name</label>
          <input type="text" id="new-account-name" class="text-input" placeholder="e.g. Riverside Dental Group" autofocus>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="cancel-new">Cancel</button>
          <button class="btn btn-primary" id="confirm-new">Create account</button>
        </div>
      </div>
    </div>
  `;
  const input = document.getElementById('new-account-name');
  const close = () => root.innerHTML = '';
  document.getElementById('modal-overlay').onclick = (e) => { if(e.target.id==='modal-overlay') close(); };
  document.getElementById('cancel-new').onclick = close;
  document.getElementById('confirm-new').onclick = () => {
    const acc = newAccount(input.value.trim() || 'New Account');
    state.accounts.unshift(acc);
    persist();
    close();
    openDetail(acc.id);
  };
  input.onkeydown = (e) => { if(e.key === 'Enter') document.getElementById('confirm-new').click(); };
  setTimeout(()=>input.focus(), 30);
}

/* ---------------------------------------------------------

--------------------------------------------------------- */
function openDetail(id){
  currentAccountId = id;
  document.getElementById('overview-view').classList.add('hidden');
  document.getElementById('detail-view').classList.remove('hidden');
  renderDetail();
  window.scrollTo(0,0);
}
function backToOverview(){
  currentAccountId = null;
  document.getElementById('detail-view').classList.add('hidden');
  document.getElementById('overview-view').classList.remove('hidden');
  renderOverview();
}
function getAccount(){ return state.accounts.find(a => a.id === currentAccountId); }
function updateAccount(mutator){
  const acc = getAccount();
  if(!acc) return;
  mutator(acc);
  persist();
  renderDetail();
  // keep overview data fresh for when we go back
}

function bindRichTextEditor(a){
  const editor = document.getElementById('current-update');
  const toolbar = document.getElementById('rte-toolbar');
  if(!editor || !toolbar) return;

  function runCommand(cmd){
    if(cmd === 'highlight'){
      if(!document.execCommand('hiliteColor', false, '#FDF2A4')){
        document.execCommand('backColor', false, '#FDF2A4');
      }
      return;
    }
    if(cmd === 'blockquote'){
      const current = (document.queryCommandValue('formatBlock') || '').toLowerCase();
      document.execCommand('formatBlock', false, current === 'blockquote' ? 'P' : 'BLOCKQUOTE');
      return;
    }
    if(cmd === 'link'){
      // Save the current selection before the modal steals focus, so we can
      // restore it and apply the link to the right text once the URL is submitted.
      const sel = window.getSelection();
      const savedRange = (sel && sel.rangeCount > 0) ? sel.getRangeAt(0).cloneRange() : null;
      showPromptModal('Insert Link', 'https://…', 'Add Link', (url) => {
        editor.focus();
        if(savedRange){
          const sel2 = window.getSelection();
          sel2.removeAllRanges();
          sel2.addRange(savedRange);
        }
        document.execCommand('createLink', false, url);
        updateToolbarState();
        scheduleSave();
      });
      return;
    }
    document.execCommand(cmd, false, null);
  }

  function updateToolbarState(){
    const stateCmds = ['bold','italic','underline','strikeThrough','insertUnorderedList','insertOrderedList'];
    stateCmds.forEach(cmd => {
      const btn = toolbar.querySelector(`[data-cmd="${cmd}"]`);
      if(!btn) return;
      let active = false;
      try{ active = document.queryCommandState(cmd); }catch(e){}
      btn.classList.toggle('active', active);
    });
    const quoteBtn = toolbar.querySelector('[data-cmd="blockquote"]');
    if(quoteBtn){
      let block = '';
      try{ block = (document.queryCommandValue('formatBlock')||'').toLowerCase(); }catch(e){}
      quoteBtn.classList.toggle('active', block === 'blockquote');
    }
  }

  function scheduleSave(){
    clearTimeout(rteSaveTimer);
    rteSaveTimer = setTimeout(() => {
      const acc = getAccount();
      if(acc) acc.currentUpdate = editor.innerHTML;
      persist();
    }, 400);
  }

  toolbar.addEventListener('mousedown', (e) => {
    if(e.target.closest('.rte-btn')) e.preventDefault(); // keep selection inside editor
  });
  toolbar.addEventListener('click', (e) => {
    const btn = e.target.closest('.rte-btn');
    if(!btn) return;
    editor.focus();
    runCommand(btn.dataset.cmd);
    updateToolbarState();
    scheduleSave();
  });

  editor.addEventListener('input', () => { scheduleSave(); updateToolbarState(); });
  editor.addEventListener('keyup', updateToolbarState);
  editor.addEventListener('mouseup', updateToolbarState);
  editor.addEventListener('keydown', (e) => {
    if(e.key !== 'Tab') return;
    // Only hijack Tab when the cursor is inside a list item — otherwise let Tab behave normally.
    const sel = window.getSelection();
    let node = sel && sel.anchorNode;
    let li = null;
    while(node && node !== editor){
      if(node.nodeType === 1 && node.tagName === 'LI'){ li = node; break; }
      node = node.parentNode;
    }
    if(li){
      e.preventDefault();
      document.execCommand(e.shiftKey ? 'outdent' : 'indent');
      updateToolbarState();
      scheduleSave();
    }
  });
  editor.addEventListener('blur', () => {
    clearTimeout(rteSaveTimer);
    const acc = getAccount();
    if(acc) acc.currentUpdate = editor.innerHTML;
    persist();
  });
}

function bindDetailEvents(a){
  document.getElementById('btn-back').onclick = backToOverview;
  document.getElementById('btn-delete').onclick = () => {
    showConfirmModal(
      'Delete Account',
      `Are you sure you want to delete "${a.name}"? This can't be undone.`,
      'Delete Account',
      () => {
        state.accounts = state.accounts.filter(x => x.id !== a.id);
        persist();
        backToOverview();
      }
    );
  };

  document.getElementById('acc-name').onchange = (e) => updateAccount(acc => acc.name = e.target.value.trim() || 'Untitled account');

  // Health
  document.querySelectorAll('[data-health]').forEach(btn => {
    btn.onclick = () => updateAccount(acc => acc.health = btn.dataset.health);
  });
  // Segment
  document.querySelectorAll('[data-segment]').forEach(btn => {
    btn.onclick = () => updateAccount(acc => acc.segment = btn.dataset.segment);
  });
  // Experience
  document.querySelectorAll('[data-experience]').forEach(btn => {
    btn.onclick = () => updateAccount(acc => acc.experience = btn.dataset.experience);
  });

  // Section edit/done toggles (Account Details, each product group, Meeting Cadence, links)
  document.querySelectorAll('.section-edit-btn').forEach(btn => {
    btn.onclick = () => {
      const section = btn.dataset.section;
      toggleSectionEdit(a.id, section, sectionHasData(a, section));
      renderDetail();
    };
  });

  // Account Details: PMS rows (only present while that section is in edit mode)
  const btnAddPms = document.getElementById('btn-add-pms');
  if(btnAddPms) btnAddPms.onclick = () => updateAccount(acc => acc.pms.push({name:'', practices:0}));
  document.querySelectorAll('.pms-row').forEach(row => {
    const idx = Number(row.dataset.idx);
    row.querySelector('.pms-name').onchange = (e) => updateAccount(acc => acc.pms[idx].name = e.target.value);
    row.querySelector('.pms-practices').onchange = (e) => updateAccount(acc => acc.pms[idx].practices = Number(e.target.value)||0);
    row.querySelector('.pms-remove').onclick = () => updateAccount(acc => acc.pms.splice(idx,1));
  });

  // Account Details: Imaging Software rows
  const btnAddImaging = document.getElementById('btn-add-imaging');
  if(btnAddImaging) btnAddImaging.onclick = () => updateAccount(acc => acc.imaging.push({name:'', practices:0}));
  document.querySelectorAll('.imaging-row').forEach(row => {
    const idx = Number(row.dataset.idx);
    row.querySelector('.imaging-name').onchange = (e) => updateAccount(acc => acc.imaging[idx].name = e.target.value);
    row.querySelector('.imaging-practices').onchange = (e) => updateAccount(acc => acc.imaging[idx].practices = Number(e.target.value)||0);
    row.querySelector('.imaging-remove').onclick = () => updateAccount(acc => acc.imaging.splice(idx,1));
  });

  // Important links
  document.getElementById('btn-add-link').onclick = () => updateAccount(acc => acc.links.push({id: uid(), label:'', url:''}));
  document.querySelectorAll('.link-row').forEach(row => {
    const idx = Number(row.dataset.idx);
    row.querySelector('.link-label').onchange = (e) => updateAccount(acc => {
      acc.links[idx].label = e.target.value;
      if(acc.links[idx].label.trim() && acc.links[idx].url.trim()) clearSectionOverride(acc.id, `link:${acc.links[idx].id}`);
    });
    row.querySelector('.link-url').onchange = (e) => updateAccount(acc => {
      acc.links[idx].url = e.target.value;
      if(acc.links[idx].label.trim() && acc.links[idx].url.trim()) clearSectionOverride(acc.id, `link:${acc.links[idx].id}`);
    });
    row.querySelector('.link-remove').onclick = () => updateAccount(acc => acc.links.splice(idx,1));
    const openBtn = row.querySelector('.link-open');
    openBtn.onclick = (e) => { if(!row.querySelector('.link-url').value) e.preventDefault(); };
  });
  document.querySelectorAll('.link-row-display').forEach(row => {
    const idx = Number(row.dataset.idx);
    row.querySelector('.link-edit').onclick = () => {
      editState[`${a.id}:link:${a.links[idx].id}`] = true;
      renderDetail();
    };
    row.querySelector('.link-remove').onclick = () => updateAccount(acc => acc.links.splice(idx,1));
  });

  // Videa team
  document.querySelectorAll('.team-row').forEach(row => {
    const role = row.dataset.role;
    row.querySelector('.team-name').onchange = (e) => updateAccount(acc => acc.team[role] = e.target.value);
  });

  // Product Mix: toggle the "add products" checklist open/closed
  const btnToggleAddProducts = document.getElementById('btn-toggle-add-products');
  if(btnToggleAddProducts){
    btnToggleAddProducts.onclick = () => {
      addProductsOpen[a.id] = true;
      renderDetail();
    };
  }
  const btnCancelAddProducts = document.getElementById('btn-cancel-add-products');
  if(btnCancelAddProducts){
    btnCancelAddProducts.onclick = () => {
      addProductsOpen[a.id] = false;
      renderDetail();
    };
  }

  // Product Mix: select some remaining products, then group them together
  const btnGroupSelected = document.getElementById('btn-group-selected');
  if(btnGroupSelected){
    btnGroupSelected.onclick = () => {
      const checked = Array.from(document.querySelectorAll('[data-remaining-product]:checked')).map(cb => cb.dataset.remainingProduct);
      if(checked.length === 0) return;
      addProductsOpen[a.id] = false;
      updateAccount(acc => {
        const newGroup = { id: uid(), products: checked, phase: 'Pilot', ...defaultGroupFields() };
        acc.productGroups.push(newGroup);
      });
    };
  }

  // Product Mix: remove/ungroup a group entirely (its products return to the unassigned pool)
  document.querySelectorAll('.remove-group-btn').forEach(btn => {
    const groupId = btn.dataset.groupId;
    btn.onclick = () => updateAccount(acc => {
      acc.productGroups = acc.productGroups.filter(g => g.id !== groupId);
    });
  });

  // Product Mix: phase pill per group
  document.querySelectorAll('[data-group-phase]').forEach(btn => {
    const groupId = btn.dataset.groupPhase;
    btn.onclick = () => updateAccount(acc => {
      const g = acc.productGroups.find(gr => gr.id === groupId);
      if(g) g.phase = btn.dataset.phaseValue;
    });
  });

  // Product Mix: group fields (dates, live, contracted, dropped info) — encoded as "groupId:fieldName"
  document.querySelectorAll('[data-group-field]').forEach(el => {
    const [groupId, field] = el.dataset.groupField.split(':');
    el.onchange = (e) => updateAccount(acc => {
      const g = acc.productGroups.find(gr => gr.id === groupId);
      if(!g) return;
      if(field === 'startDate' || field === 'endDate' || field === 'dateDropped' || field === 'reason'){
        g[field] = e.target.value;
      } else {
        g[field] = Number(e.target.value)||0;
      }
    });
  });

  // Product Mix: optional practice names per group (Pilot only)
  document.querySelectorAll('.add-group-practice-name').forEach(btn => {
    const groupId = btn.dataset.groupId;
    btn.onclick = () => updateAccount(acc => {
      const g = acc.productGroups.find(gr => gr.id === groupId);
      if(g) g.groupNames.push('');
    });
  });
  document.querySelectorAll('.group-names-list').forEach(container => {
    const groupId = container.dataset.groupId;
    container.querySelectorAll('.group-name-row').forEach(row => {
      const idx = Number(row.dataset.idx);
      row.querySelector('.group-practice-name').onchange = (e) => updateAccount(acc => {
        const g = acc.productGroups.find(gr => gr.id === groupId);
        if(g) g.groupNames[idx] = e.target.value;
      });
      row.querySelector('.group-practice-name-remove').onclick = () => updateAccount(acc => {
        const g = acc.productGroups.find(gr => gr.id === groupId);
        if(g) g.groupNames.splice(idx,1);
      });
    });
  });

  // Cadence (only present while that section is in edit mode)
  const cadenceDayEl = document.getElementById('cadence-day');
  const cadenceTimeEl = document.getElementById('cadence-time');
  const cadenceFrequencyEl = document.getElementById('cadence-frequency');
  if(cadenceDayEl) cadenceDayEl.onchange = (e) => updateAccount(acc => acc.cadence.day = e.target.value);
  if(cadenceTimeEl) cadenceTimeEl.onchange = (e) => updateAccount(acc => acc.cadence.time = e.target.value);
  if(cadenceFrequencyEl) cadenceFrequencyEl.onchange = (e) => updateAccount(acc => acc.cadence.frequency = e.target.value);

  // Current update — rich text editor
  bindRichTextEditor(a);

  // Action items
  document.querySelectorAll('.action-item').forEach(row => {
    const id = row.dataset.id;
    row.querySelector('input[type=checkbox]').onchange = (e) => updateAccount(acc => {
      const item = acc.actionItems.find(i => i.id === id);
      if(item) item.done = e.target.checked;
    });
    row.querySelector('.action-remove').onclick = () => updateAccount(acc => acc.actionItems = acc.actionItems.filter(i => i.id !== id));
  });
  const newActionInput = document.getElementById('new-action-text');
  newActionInput.onkeydown = (e) => {
    if(e.key === 'Enter' && newActionInput.value.trim()){
      updateAccount(acc => acc.actionItems.push({id: uid(), text: newActionInput.value.trim(), done:false}));
      setTimeout(()=>document.getElementById('new-action-text').focus(), 30);
    }
  };
}

function render(){
  renderHeaderActions();
  if(currentAccountId && getAccount()){
    document.getElementById('overview-view').classList.add('hidden');
    document.getElementById('detail-view').classList.remove('hidden');
    renderDetail();
  } else {
    document.getElementById('detail-view').classList.add('hidden');
    document.getElementById('overview-view').classList.remove('hidden');
    renderOverview();
  }
}

async function verifyStorageWorks(){
  const testKey = '__storage_check__';
  const testValue = String(Date.now());
  try{
    localStorage.setItem(testKey, testValue);
    const ok = localStorage.getItem(testKey) === testValue;
    localStorage.removeItem(testKey);
    return ok;
  }catch(e){
    return false;
  }
}

async function boot(){
  document.getElementById('overview-view').innerHTML = `
    <div class="empty-state"><p>Loading your accounts…</p></div>`;

  const storageOK = await verifyStorageWorks();
  if(!storageOK){
    // Storage itself isn't reachable right now (commonly private/incognito mode, or
    // storage disabled in this browser). Do NOT attempt to load or save — an empty
    // in-memory state must never be written over data that may still be sitting in
    // storage but is temporarily unreachable.
    state = { accounts: [] };
    dataReady = false;
    render();
    console.warn('Storage is not available in this browser context — editing is disabled to protect existing data.');
    return;
  }

  try{
    state = await loadState();
    dataReady = true; // storage is confirmed working AND the load succeeded — safe to save now
  }catch(e){
    console.warn('Unexpected error loading saved accounts — not treating this as "no data"', e);
    state = { accounts: [] };
    dataReady = false;
    render();
    return;
  }
  render();
}
boot();
